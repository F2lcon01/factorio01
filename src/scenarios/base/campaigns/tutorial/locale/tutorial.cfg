name=الدرس التعليمي
description=بعد هبوطك الاضطراري على هذا العالم الغريب، ستحتاج إلى استكشاف المنطقة وجمع الموارد المحلية وجعل إنتاج العناصر اللازمة لبقائك آليا.\nسلسلة من خمسة مستويات للاعبين الجدد.\nيمكن لعب المستويين 4 و5 في وضع اللعب الجماعي.
