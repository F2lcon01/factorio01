text=[font=heading-2]تهانينا، لقد وصلت إلى نهاية الدرس التعليمي.[/font][font=default]\n\nيمكنك مواصلة اللعب في هذا المستوى قدر ما تشاء، أو الخروج وبناء مصنع جديد في طور اللعب الحر.\n\nطور اللعب الحر هو الطريقة الأساسية للعب. ستبدأ ببضع إمدادات فقط، وعليك توسيع مصنعك بهدف إطلاق صاروخ إلى الفضاء.\n\nستبحث وتستكشف كل الميزات التي تقدمها Factorio لتنمية إنتاجك، وستدافع عنه في وجه السكان الأصليين الذين لا يحبونك.[/font]
text-demo=[font=heading-2]تهانينا، لقد وصلت إلى نهاية العرض التجريبي.[/font][font=default]\n\nيمكنك مواصلة اللعب في هذا المستوى قدر ما تشاء.\n\nنأمل أن تفكر في شراء Factorio لفتح كامل محتوى اللعبة، حيث ستتمكن من:[/font]
feature-1=العب اللعب الحر: الطريقة الرئيسية للعب اللعبة. سوف تبدأ ببضع إمدادات، ويجب عليك بناء مصنّعك بهدف إطلاق صاروخ للفضاء. ستبحث و تستكشف كل الميزات التي تقدمها Factorio لمساعدتك في زيادة إنتاجك، و تدافع عنها من المحليين غير المعجبين بك.
feature-2=انضم إلى الجلسات  المشتركة، و ابنِ مصنعاً مع أصدقائك.
feature-3=العب بواحدٍ من العديد من السيناريوهات التنافسية و المثيرة، مثل: دفاع الحملات و تحدي التصنيع.
feature-4=استكشاف و تنزيل التعديلات من بوابة التعديلات المدمجة، و تحقيق أقصى استخدام للدعم الرسمي للتعديلات.
feature-5=اكتشف العديد من الميزات والآليات الجديدة للعب، بما في ذلك: تصنيع النفط، الطاقة النووية، الدروع المدمجة، المخططات و البناء الآلي، أبراج المدفعية، محفزات الإنتاج، و المسيرات الطائرة.
feature-6=و الكثير لتستمع به...
thanks=شكرا على اللعب،\nفريق Factorio
continue=المتابعة
