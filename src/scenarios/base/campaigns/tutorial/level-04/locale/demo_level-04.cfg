msg-sector-scan-completed=تمت عملية فحص القطاع.
msg-detected-distress-beacon=اكتشف الرادار محطة استغاثة، لكن الإشارة ضعيفة للغاية.
think-track-distress-beacon-1=حسنٌ. بناءً على ضعف الإشارة، لا بد أن المصدر على بعد أكثر من 200 كيلومتر.
think-track-distress-beacon-2=يبدو أن قوة الإشارة آخذة في الانحدار. سيأخذ المشي وقتاً أكثر من المحتمل.
think-track-distress-beacon-3=إذا أردتُ تتبُع المصدر، سأحتاج إلى وسيلة نقل أسرع.
think-track-distress-beacon-4=يجب أن أبحث أولاً عن شيء يساعدني في الاحتماء من الأعداء.
goal-build-lab=اصنع و ابنٍ مختبراً.
msg-research-labs-1=سوف تستهلك المختبرات حزم العلوم، و تستخدمها في اكتشاف التقنيات المحددة.
msg-research-labs-2=تحتاج التقنيات إلى عدد معين من الحزم العلمية لاستكشافها؛ لذا فاستخدام المزيد من المختبرات سيسرع بحثك طالما زودتها بحزم العلوم.
think-research-car-1=عظيم. أستطيع الآن بناء جدار لإبقاء الأعداء خارجاً. ثم يمكنني التركيز على أمور أكثر أهمية.
think-research-car-2=أحتاج إلى زيادة إنتاجي و اكتشاف مواد أكثر تقدماً.
think-research-car-3=حينها يمكن أن أكون قادراً على صناعة سيارة.
goal-research-automobilism=استخدم المختبرات لاستكشاف بحث المركبات.
goal-build-car=اصنع سيارة.
think-car-crash=أوه، ذلك سيترك أثراً.
think-stop-messing-around-1=حسنٌ، هذا يكفي من المتعة.
think-stop-messing-around-2=يجب أن أحزم للرحلة. لا أعلم فيم أقحم نفسي.
goal-prepare-materials=احزم سيارتك بالمعدات.
think-lets-go=حسنٌ، يفترض أننا انتهينا. لننطلق!
think-automate-science-pack-crafting=همم، أنا أصنع الكثير من الحزم العلمية هذه بيدي. ربما ينبغي تألية العملية بآلات التجميع.
think-pollution-tip=همم... لا بد من سببٍ ما يدفع السكان الأصليين لمهاجمة المصنع...  ربما لا يعجبهم التلوث؟
think-kill-bases-tip=ليس لدى هؤلاء العضّاضين أي نيةٍ للاستسلام. ربما عليّ القضاء عليهم من حيث أتوا. ذلك سيقضي عليهم نهائياً.
think-low-power=لماذا بدأت بعض آلاتي بالتباطؤ؟ يجب أن أتأكد أن الطاقة المتولدة موفية بالحاجة.
