computer-title=حاسوب
think-find-ship=يمكنني استخدام بعض الموارد من سفينتنا المحطمة، ولكن أولاً أحتاج إلى تحديد مكانها.
think-use-radar=إذا كان لدي ما يكفي من الكهرباء سأتمكن من صنع رادار لتحديد موقع التحطم المتبعثر.
think-simple-setup=لدي إعداد اختبار الكهرباء جهزة تقريبًا. أنا فقط بحاجة إلى بعض الماء من البحيرة.
goal-build-pump=قم بناء مضخة بحرية على ترف الماء.
goal-connect-boiler-to-water=ببناء أنابيب لتوصيل المياه من المضخة البحرية إلى المصنع.
goal-fuel-into-boiler=ضع بعض الوقود في الغلاية لإنتاج البخار.
goal-connect-boiler-to-steam-engine=بناء أنابيب لربط مخرجات البخار بالمحرك البخاري.
think-electricity-setup=جيد، المحرك البخاري ينتج الكهرباء الآن.
msg-steam-engine-introduction-1=هناك المزيد من الطرق لبناء المحركات البخارية. مثل هذا:
msg-steam-engine-introduction-2=أو هذا:
goal-build-electric-mining-drill=بناء حفار التنقيب الكهربائي على بعض الموارد.
goal-power-electric-mining-drill=قم بتوصيل حفار التنقيب بالكهربائي من المحرك البخاري باستخدام أعمدة كهربائية صغيرة.
think-piece-of-cake=حسنا، جميعها تعمل. هذا مجرد قطعة من كعكة.
msg-factory-instruction-1=من أجل بناء الرادارات سوف تحتاج لجمع بعض صفائح الحديد وصفائح النحاس أولاً.
msg-factory-instruction-2=استخدم حفار التنقيب الكهربائي لاستخراج الموارد. إنه أسرع بكثير من حفار تعدين الحارق.
msg-factory-instruction-3=حافظ على تدفق ثابت من الفحم لكي يذهب إلى مرافقك. وإلا ستنفد الكهرباء.
think-factory-instruction=يجب أن أبقي على تدفق ثابت من الفحم لكي يذهب إلى الغلاية. وإلا فستنفد الكهرباء.
think-get-to-work=دعونا نبدأ العمل.
goal-build-radars=جمع الموارد وبناء الرادار: __1__ / __2__
think-resources-collected=جيد، أعتقد أن لدينا كل شيء للبدء في بناء الرادارات.
think-beware-of-creepers=آمل ألا أجذب الكثير من الوحوش.
msg-start-with-radars-1=الرادارات تبحث في المناطق المحيطة بها. كلما زدت من عدد الرادارات لديك كلما ستكون قادراً على تحديد موقع حطم السفينة بشكل أسرع.
msg-start-with-radars-2=تستهلك الرادارات الكثير من الكهرباء. احذر من أن إنتاج الطاقة الخاص بك كاف.
msg-protect-radars=الأعداء قد يهاجمون أجهزة الرادار الخاصة بك. يمكنك حمايتها بواسطة أبراج الدفاع.
msg-sector-scan-completed=تمت عملية فحص القطاع.
msg-ship-wreck-located=حطم السفينة الصغيرة يقع في الجنوبي الشرقي.
think-explore-ship-wreck=حسنا، لقد حان الوقت لاستكشاف هذه المنطقة.
think-need-better-weapon=هذا المسدس لم يكن كافياً لصدهم. يجب علي صناعة مدفع رشاش.
think-need-better-defense=لن أتمكن من الاحتفاظ بها بنفسي. يمكنني استخدام بعض أبراج البنادق للدفاع عن قاعدتي.
think-repair-pack=يبدو أنهم يحبون ذوق الرادار. يمكنني إصلاح الضرر باستخدام حازمة إصلاح.
think-craft-more-ammo=أنا منخفض في مجلات الأسلحة النارية. ربما أستطيع أتمتها باستخدام آلة تجميع.
think-electric-mining=يمكنني استخدام آلات التنقيب الكهربائي. وهي أسرع بكثير من آلات التنقيب بالفحم.
think-build-more-radars=سيكون هذا أسرع إذا كان لدي المزيد من الرادارات.
msg-radar-under-attack=أحد الرادارات الخاص بك يتعرض للهجوم.
think-need-light=المكان يزداد ظلام، يجب أن اصنع بعض المصابيح.
msg-active-gun=يمكنك تجهيز العديد من الأسلحة. يتم وضع علامة واحدة على السلاح ناشط بخلفية خضراء.
msg-change-active-gun=يمكنك تغيير الأسلحة النشطة بالضغط على __CONTROL__next-weapon__ (السلاح يجب أن يتوفر عليه به ذخيرة لتغييره).
