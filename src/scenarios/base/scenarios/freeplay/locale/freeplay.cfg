msg-intro=مرحبًا بك في وضع اللعب الحر في فيكتوريو. مهمتك هي إطلاق صاروخ إلى الفضاء. ستحتاج إلى البحث في التقنيات المتقدمة من أجل فتح منصة الصواريخ. ابدأ صغيرًا وطور نفسك باستخدام الأتمتة. احمِ نفسك من السكان المحليّن، إنهم لا يحبون وجودك. منصة الصواريخ.
msg-intro-space-age=مرحبًا بك في وضع اللعب الحر في فيكتوريو: عصر الفضاء. مهمتك هي إرسال أقمار صناعية بين النجوم. ستحتاج إلى البحث في التقنيات المتقدمة من أجل فتح منصة الصواريخ واكتشاف كواكب أخرى. ابدأ صغيرًا وطور نفسك باستخدام الأتمتة، وابنِ قاعدة عمليات موثوقة، واطمح للوصول إلى النجوم. احمِ نفسك من الأنواع المحلية، حيث قد لا يقدرون وجودك.
