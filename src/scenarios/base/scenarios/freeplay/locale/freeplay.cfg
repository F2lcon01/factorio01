msg-intro=مرحبًا بك في وضع اللعب الحر في فاكتوريو. مهمتك هي إطلاق صاروخ إلى الفضاء. ستحتاج إلى البحث في التقنيات المتقدمة من أجل فتح منصة الصواريخ. ابدأ صغيرًا وطور نفسك باستخدام الأتمتة. احمِ نفسك من السكان المحليّن، إنهم لا يحبون وجودك. منصة الصواريخ.
msg-intro-space-age=مرحبًا بك في وضع اللعب الحر في فاكتوريو: عصر الفضاء. مهمتك هي إرسال أقمار صناعية بين النجوم. ستحتاج إلى البحث في التقنيات المتقدمة من أجل فتح منصة الصواريخ واكتشاف كواكب أخرى. ابدأ صغيرًا وطور نفسك باستخدام الأتمتة، وابنِ قاعدة عمليات موثوقة، واطمح للوصول إلى النجوم. احمِ نفسك من الأنواع المحلية، حيث قد لا يقدرون وجودك.
scenario-name=اللعب الحر
scenario-name-space-age=اللعب الحر (عصر الفضاء)
description=مهمتك إطلاق صاروخ إلى الفضاء. ستحتاج إلى بحث تقنيات متقدمة لفتح منصة إطلاق الصاروخ. ابدأ صغيرا ثم توسع تدريجيا بالتشغيل الآلي. احمِ نفسك من الكائنات الأصلية، فقد لا ترحب بوجودك.\n[font=default-bold]هذه هي الطريقة المقصودة للعب Factorio.[/font]
description-space-age=مهمتك إرسال منصة فضائية عابرة للنجوم. ستحتاج إلى بحث تقنيات متقدمة لفتح منصة إطلاق الصاروخ واكتشاف كواكب أخرى. ابدأ صغيرا، ثم توسع تدريجيا بالتشغيل الآلي، وابنِ قاعدة عمليات موثوقة، وانطلق نحو النجوم. احمِ نفسك من الكائنات الأصلية، فقد لا ترحب بوجودك.\n[font=default-bold]هذه هي الطريقة المقصودة للعب Factorio: Space Age.[/font]
victory-message=[font=default-bold]تهانينا!\nلقد فزت باللعبة بإطلاق صاروخ إلى الفضاء![/font]\n\nيمكنك مواصلة اللعب في هذا المستوى قدر ما تشاء.\n\nرغم فوزك، لا يزال هناك الكثير لإنجازه:
victory-bullet-point-1=قم بتوسيع مصنعك
victory-bullet-point-2=البحث في التقنيات اللانهائية
victory-bullet-point-3=حسّن إنتاجك
victory-bullet-point-4=فتح المزيد من الإنجازات
victory-final-message=شكرا على اللعب.\nفريق Factorio
