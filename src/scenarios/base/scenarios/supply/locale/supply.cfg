welcome=مرحباً بك في مهمة تحدي الإمدادات.
rules1=في كل مستوى، لديك مدّة محدودة لتزويد الصناديق المحددة بالكميات المطلوبة من المواد المحددة.
rules2=تزداد المتطلبات صعوبة مع كل مستوىً.
rules3=ستحصل على 10 أضعاف رَقْم المستوى لإنهاء المستوى، بالإضافة إلى مكافأة زمنية لإنهاء المستوى بسرعة.
rules4=يمكنك إما مقايضة الوقت المتبقي بالنقاط، أو استخدامه للاستعداد للمستوى التالي.
rules5=حظاً موفقاً.
