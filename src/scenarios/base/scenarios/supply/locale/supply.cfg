description=حقق أهداف الإنتاج المطلوبة وابنِ مصنعك لتلبية الطلب المتزايد باستمرار.\nاكسب نقاطا عند إنهاء كل مستوى وعند تسليم الإمدادات قبل موعدها.\nالعب فرديا أو جماعيا.
