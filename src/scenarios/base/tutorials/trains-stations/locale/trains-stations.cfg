intro=يهدف هذا الدرس إلى تعليم كيفية استخدام محطات وقوف القطار و الجداول؛ لإعداد نظام نقل المعادن من المناجم و الأفران.
place-stop=ابنِ محطة قطار في الموقع المحدد.
place-locomotive=ابنِ القاطرة عند محطة القطار.
place-locomotive-info=حينما تكون قرب محطة القطار، موجهاً القاطرة في الاتجاه الصحيح، سينجذب طيف القاطرة إلى المحطة.
place-wagon=ابنِ عربة البضائع خلف القاطرة.
place-wagon-info=عربة البضائع ستريك علامات للاتصال إذا كانت في مكانها الصحيح.
set-schedule=أضف محطة التوقف"__1__" إلى جدول القطار مع شرط الانتظار "__2__".
start-train=اضبط القطار على الوضع التلقائي.
fuel-train=حمّل القاطرة بالوقود بالناقل.
load-wagon=ابنِ النواقل لتحميل العربة بخام الحديد.
trains-will-loop=الآن سيقوم القطار تلقائيًا بنقل الخام بين محطتي القطار.
unload-train=فرّغ عربة النقل من خام الحديد و أدخله في الأفران.
unload-train-info=تلميح: استخدم الصناديق كمخازن مؤقتة، و ابنِها بين العربة و الأحزمة لتسريع التفريغ.
finish=إنهاء
