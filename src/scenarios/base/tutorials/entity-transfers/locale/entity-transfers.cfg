ctrl-click-to-entity=اضغط __ALT_CONTROL__1__fast-entity-transfer__ على الفرن الحجري وأنت تحمل الفحم لنقل الحزمة إليه.
ctrl-click-to-entity-2=خذ الحديد الخام من الشريط السريع، واستخدم __CONTROL__fast-entity-transfer__ لوضعه في الفرن الحجري.
ctrl-click-to-entity-2-controller=خذ الحديد الخام من اللوحة السريعة (__CONTROL__show-quick-panel__)، واستخدم __CONTROL__fast-entity-transfer__ لوضعه في الفرن الحجري.
ctrl-click-from-entity=اضغط __ALT_CONTROL__1__fast-entity-transfer__ على الفرن الحجري ومؤشرك فارغ لأخذ الصفائح الحديدية منه.
ctrl-click-to-furnaces=استخدم خاصية النقل السريع الجديدة لأخذ الفحم والحديد الخام من الصندوق، وإدخالهما في جميع الأفران.
ctrl-click-to-furnaces-note=ملاحظة: تستطيع التمرير على كل الأفران -ما دمت ضاغطاً على زر الفأرة- للنقل السريع؛ لا تحتاج الضغط على كل فرن على حدة.
ctrl-click-to-furnaces-note-controller=ملاحظة: يمكنك الضغط باستمرار على __CONTROL__fast-entity-transfer__ والتحرك باستخدام __CONTROL__move__ للنقل السريع إلى مباني متعددة في خط واحد، ولا تحتاج إلى الضغط بشكل فردي على __CONTROL__fast-entity-transfer__ على كل فرن.
ctrl-click-from-furnaces=استخدم خاصية نقل المواد السريع لأخذ صفائح الحديد من كل الأفران.
finish-text=بهذا ينتهي هذا البرنامج التعليمي.
finish-text-controller-note=اضغط __ALT_CONTROL__1__toggle-free-cursor__ واستخدم المؤشر للضغط على زر «إنهاء».
finish=إنهاء
