ctrl-click-to-furnaces=استخدم خاصية نقل المواد السريع لأخذ الفحم و خام الحديد من الصندوق، و إدخالهما في جميع الأفران.
ctrl-click-to-furnaces-note=ملاحظة: تستطيع التمرير على كل الأفران -ما دمت ضاغطاً على زر الفأرة- للنقل السريع؛ لا تحتاج الضغط على كل فرن على حدة.
ctrl-click-to-furnaces-note-controller=ملاحظة: يمكنك الضغط باستمرار على __CONTROL__fast-entity-transfer__ والتحرك باستخدام __CONTROL__move__ للنقل السريع إلى مباني متعددة في خط واحد، ولا تحتاج إلى الضغط بشكل فردي على __CONTROL__fast-entity-transfer__ على كل فرن.
ctrl-click-from-furnaces=استخدم خاصية نقل المواد السريع لأخذ صفائح الحديد من كل الأفران.
finish-text=بهذا ينتهي هذا البرنامج التعليمي.
finish=إنهاء
