deadlock-1=في هذه الحالة، القطار الأزرق الثاني يعترض التقاطع، لذلك لا يمكن للقطار الأحمر أن يصل إلى المحطة.
deadlock-2=القطار الأحمر لا يمكن أن يكمل الطريق إلا عندما يتحرك القطار الأزرق.
chain-signal-1=بناء الإشارات المتسلسلة قبل التداخل يمنع القطار من الدخول ما لم يكن المخرج سالكاً أيضاً.
chain-signal-2=سينتظر القطار الأزرق (على اليسار) عند الإشارة حتى يكون مساره مفتوحاً، ولن يعترض مسار القطار الأحمر.
fix-intersection=ابنِ أو استبدل بعض الإشارات للسماح للقطار الأحمر بالوصول إلى المحطة.
fix-intersection-2=استخدم خبرتك بكلا نوعي الإشارات للسماح لجميع القطارات بالوصول إلى محطاتها.
start-trains=تفعيل القطارات
reset-trains=إعادة ضبط القطارات
reset-all=إعادة ضبط الكل
chain-green=إشارة السلسلة هي النوع الثاني من إشارات السكك الحديدية. فهي تقرأ الإشارات التالية على طول المسار وتغير حالتها وفقا لذلك.\n\nإشارة السلسلة الخضراء تعني أن جميع الإشارات التي بعدها خضراء.
chain-blue-go=إشارة السلسلة الزرقاء تعني أن بعض مسارات الخروج فقط مفتوحة، لذا قد يتوقف القطار هنا أو يواصل سيره. في هذه الحالة تحديدا، إحدى إشارات الخروج حمراء، ولهذا أصبحت إشارة السلسلة زرقاء.\n\nيمكن للقطار تجاوز هذه الإشارة الزرقاء لأن المسار إلى وجهته مفتوح.
chain-blue-stop=في هذه الحالة، سينتظر القطار عند الإشارة الزرقاء لأن الطريق إلى وجهته غير واضح.
chain-red=إشارة السلسلة الحمراء تعني أن جميع الإشارات بعد أن تكون أحمر. القطار سينتظر عند إشارة السلسلة الحمراء.
finish=النهاية
finish-info=حصلت على بعض العناصر لتجربة إشارات القطارات.\n\nاضغط زر «النهاية» لإنهاء الدرس التعليمي.
[label]
red-train=قطار أحمر
red-stop=محطة القطار الحمراء
cyan-stop=محطة القطار الزرقاء
rail-chain-signal=سلسلة الإشارة
rail-signal=إشارة السكك الحديدية
