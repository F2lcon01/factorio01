trains-dont-see-trains=القطارات لا يمكنها "رؤية" القطارات الأخرى. وبدلاً من ذلك تستخدم الإشارات لمعرفة ما إذا كان قسم من السكك الحديدية متاحا أو محظوراً.
signals-split-rail=بناء إشارات بالقرب من السكك الحديدية سيقسمها إلى المزيد من الاقسام.
place-signal-goal=بناء إشارة في أي مكان على السكك الحديدية.
see-block-split=يمكنكم أن تروا أن السكك الحديدية قد تم تقسيمها إلى قسمين.
second-signal-goal=بناء إشارة ثانية لإنشاء قسم ثالث.
signal-direction=الاتجاه الذي تواجهه الإشارة متعلق بأي جانب بنيتها من السكك.
hover-signal=يمكنك أن تضغط على إشارة لرؤية اتجاهها.
signal-direction-goal=حاول نقل الإشارات إلى الجانب الآخر من المسار.
signals-read-ahead=كل إشارة تمسح المسار المسؤولة عنه وتحدد لونها وفقا لذلك.
place-wagon-goal=ضع عدة عربات شحن عدة مرات لمعرفة كيفية تأثيرها على الإشارات.
go-around-goal=قم ببناء إشارات للسماح للقطار الأحمر بالوصول إلى المحطة.
go-around-info=القطار الأحمر يمكن أن يسير في الأرجاء، لكنه لا يستطيع أن يكتشف أن القطار ذو اللون الازرق السماوي لا يغلق سوى نصف المسار.
oncoming-goal=قم ببناء إشارات للسماح للقطارين بالعبور بالتناوب والوصول إلى محطاتهما.
oncoming-info=تذكر أن الاتجاه الذي تقرأ فيه الإشارة يتم تحديده من أي جانب من المسار تعمل عليه.
siding-signals-info=في هذه الحالة، القطار الأحمر لن يدخل المسار التالي لأنه محجوز.
siding-signals-goal=بناء إشارات لعزل الجانب عن المسار الرئيسي للسماح للقطار الأحمر بالمضي قدما.
proceed-goal=قم ببناء إشارات للسماح للقطار الأحمر بالوصول إلى المحطة.
