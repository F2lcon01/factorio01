[space-location-description]
vulcanus=كوكب بركاني حار ببراكين جبلية وأنهار من الحمم وسهول من الرماد ونافورات حمض الكبريتيك. غني بالمعادن. لا يمكن عبور الحمم إلا بالسكك الحديدية المرتفعة.
gleba=كوكب رطب كثير المستنقعات العميقة. يمكن للأراضي الرطبة أن تدعم الزراعة لكن البناء عليها صعب، ويمكن ردمها لكن الحجر نادر.\nالتلال المتعرجة فيها حجر وأنسب للبناء، لكنها لا تدعم الزراعة.
fulgora=كوكب جاف تجتاحه الرياح، تضرب العواصف البرقية هضابه، وفيه محيطات نفطية يمكن عبورها بالسكك الحديدية المرتفعة.\nيبدو أن فيه بعض الأطلال.
aquilo=أرض قاحلة متجمدة بمحيطات من الأمونيا السائلة وفتحات للفلور. تتجمد المباني والأحزمة إن لم تُدفّأ بأنابيب نقل الحرارة المجاورة أو مبانٍ ساخنة أخرى.
solar-system-edge=النهاية! أو بالأحرى بداية جديدة. بناء منصة فضاء قادرة على النجاة هذا البعد عن الأمان النسبي لموقع التحطم يثبت قدرتك على السفر إلى أي مكان آخر في أعماق الفضاء العظيمة بين النجوم. لتنجو منصة فضاء من هذه الرحلة، يجب أن تكون مكتفية ذاتياً على نحو خاص، وأن تملك الأدوات اللازمة لتحويل الكويكبات الكبيرة الخطرة على طول الطريق إلى موارد قابلة للاستخدام.
shattered-planet=بقايا غامضة لعالم سابق في أعماق الفضاء بين النجوم. تحمل أشلاؤه السابحة في الفضاء الذي كان يشغله موارد لفتح تقنيات قوية. لكن الوصول إليها لا يخلو من المخاطر...
