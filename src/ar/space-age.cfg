[tips-and-tricks-item-description]
production-entity-list=[entity=electric-mining-drill] حفار التنقيب الكهربائي \n[entity=big-mining-drill] حفارة تعدين ضخمة \n[entity=pumpjack] مضخة نفط \n[entity=assembling-machine-2] جهاز التجميع 2 \n[entity=assembling-machine-3] جهاز التجميع 3 \n[entity=electric-furnace] فرن كهربائي \n[entity=recycler] معيد التدوير \n[entity=chemical-plant] مصنع الكيماويات \n[entity=centrifuge] جهاز معالجة المواد المشعة \n[entity=crusher] محطم \n[entity=foundry] مسبك \n[entity=agricultural-tower] برج زراعي \n[entity=electromagnetic-plant] محطة كهرومغناطيسية \n[entity=cryogenic-plant] محطة تبريد
fulgora-briefing=[planet=fulgora] كوكب جاف قاحل بلا أثر للحياة، مع نشاط برقي خطر في دورات الليل المتكررة.\n[entity=solar-panel] أقل فعالية بكثير، لكن يمكن جمع البرق بـ [entity=lightning-rod] وتخزينه في [entity=accumulator].\nلا توجد موارد طبيعية في أي مكان على الكوكب. المتاح فقط بقايا على شكل [entity=scrap].\nما ربما كان محيطات أصبح الآن مليئاً بـ [fluid=heavy-oil] الذي يمكن استخراجه بـ [entity=offshore-pump].\nلا يمكن ردم [tile=oil-ocean-shallow] إلا في وقت متأخر، لكن يمكن عبوره بالسكك الحديدية المرتفعة. بناء [entity=rail-support] على الأجزاء العميقة من المحيط يتطلب بحثاً إضافياً.
lightning-mechanics=يحمي [entity=lightning-rod] منطقة صغيرة من ضربات البرق ويحوّل طاقتها إلى الشبكة الكهربائية.\nيولّد البرق كمية كبيرة من الطاقة لفترة قصيرة. وجود المزيد من [entity=accumulator] يتيح استغلالاً أفضل لكل ضربة برق.\nيمكن استبداله لاحقاً بـ [entity=lightning-collector] الأكثر كفاءة.
gleba-briefing=[planet=gleba] كوكب رطب كثير المستنقعات بنباتات غريبة غنية يمكن زراعتها باستخدام [entity=agricultural-tower] ومعالجتها في [entity=biochamber].\nلن تجد هناك [entity=iron-ore] أو [entity=copper-ore] أو [entity=crude-oil] أو [entity=coal] أو [entity=uranium-ore]، لكن النباتات توفر طرقاً بديلة لإنتاج العناصر المطلوبة.\nتأتي معظم عناصر الزراعة مع تحدٍّ إضافي هو التلف بمرور الوقت. حتى [item=agricultural-science-pack] عمرها محدود ولا يمكن تخزينها.\nالمخلوقات الكبيرة ذات الأرجل الخمس هي الكائنات الأصلية لهذا الكوكب. [entity=solar-panel] أضعف لكنه ما زال صالحاً للاستخدام.
agriculture=البذور المزروعة في التربة القابلة للزراعة تنمو أشجاراً يمكن حصادها. [entity=agricultural-tower] يجعل زراعة البذور آلية.\nتنمو [entity=yumako-tree] على [tile=natural-yumako-soil]، وتنتج [item=yumako] التي تحتوي على [item=yumako-seed] لإعادة زراعة الشجرة.\nيمكن توسيع المزرعة بردم [tile=wetland-yumako] المجاورة بـ [item=artificial-yumako-soil]. تظهر هذه المناطق باللون الأصفر على الخريطة.\nينمو [entity=jellystem] على [tile=natural-jellynut-soil]، وينتج [item=jellynut] الذي يحتوي على [item=jellynut-seed] لإعادة زراعته.\nيمكن توسيع المزرعة بردم [tile=wetland-jellynut] المجاورة بـ [item=artificial-jellynut-soil]. تظهر هذه المناطق باللون الأرجواني على الخريطة.
vulcanus-briefing=[planet=vulcanus] كوكب حار بلا [fluid=water]، ولن تجد فيه [entity=crude-oil] أو [entity=uranium-ore]، لكنه يحتوي على عدة [tooltip=موارد,tips-and-tricks-item-description.vulcanus-resources] جديدة.\n[fluid=lava] مورد لانهائي من المعادن بديلاً عن رقع [item=stone] و[item=iron-ore] و[item=copper-ore]. لا توجد هذه بشكلها الخام إلا في [entity=big-volcanic-rock].\n[entity=solar-panel] أكثر فعالية بكثير. البيئة معادية ببراكين جبلية وأنهار من الحمم وسهول من الرماد ونافورات حمض الكبريتيك.\nلا يمكن ردم [tile=lava] إلا في وقت متأخر، لكن يمكن عبورها بالسكك الحديدية المرتفعة.
vulcanus-resources=موارد فولكانوس:\n[entity=sulfuric-acid-geyser] نافورة حمض الكبريتيك \n[entity=calcite] الكالسيت \n[entity=tungsten-ore] خام التنجستن
lava-processing=يمكن ضخ [fluid=lava] بـ [entity=offshore-pump] ومعالجتها في [entity=foundry] إلى [item=stone] و[fluid=molten-iron] و[fluid=molten-copper].\nيمكن التخلص من العناصر غير المرغوبة بنقلها مباشرة إلى [tile=lava].
aquilo-briefing=[planet=aquilo] أرض قاحلة متجمدة بمحيطات من الأمونيا. وهو أبعد الكواكب، ويكاد استخدام [entity=solar-panel] فيه يكون مستحيلاً.\n[entity=logistic-robot] و[entity=construction-robot] أضعف بكثير هنا.\nالمورد المألوف الوحيد هنا هو [entity=crude-oil]، لذا ستعتمد القاعدة على اللوجستيات بين الكواكب. قد يجد اللاعب نفسه عالقاً دون دعم كافٍ من الكواكب الأخرى!\nالسطح صغير جداً ويحتاج إلى توسيع. يمكن ردم المحيطات بـ [item=ice-platform] لتصبح قابلة للمشي. تُستخدم [item=concrete] أساساً للمباني وتحمي الجليد من الذوبان.\nتحتاج الكيانات إلى التدفئة لتعمل باستخدام [entity=heating-tower] و[entity=heat-pipe].
heating-mechanics=يمكن لـ [entity=heating-tower] توليد الحرارة من الوقود، ولا يتوقف عن الاحتراق عند بلوغ أقصى حرارة.\nيستخدم [entity=heat-pipe] لنقل الحرارة إلى الكيانات الأخرى.\nيجب أن يلامس كل كيان مصدر حرارة حتى لا يتجمد.\nالاستثناء هو أعمدة الكهرباء و[entity=solar-panel] و[entity=accumulator].
space-platform=تُبنى منصة الفضاء عن بُعد، وتوصل الصواريخ مواد البناء إليها. يمكن استخدامها لنقل اللاعبين والحمولات بين الكواكب.\n\n- تُستخدم [item=space-platform-starter-pack] لتأسيس المنصة، ثم تُوسّع باستخدام [item=space-platform-foundation].\n- يلتقط [entity=asteroid-collector] الكويكبات من الفضاء للحصول على المواد.\n- يُستخدم [entity=crusher] لتحطيم الكويكبات للحصول على الموارد.
orbital-logistics=يمكن لـ [entity=space-platform-hub] طلب عناصر من الشبكة اللوجستية لتوصلها الصواريخ. ويمكن الطلب التلقائي لمواد البناء الناقصة.\nيمكن ضبط [entity=rocket-silo] لتلبية طلبات منصات الفضاء تلقائياً.\nيمكن لـ [entity=cargo-landing-pad] طلب عناصر من منصة فضاء في مدار كوكبها، ما لم تكن تطلب العنصر نفسه على هذا الكوكب بالفعل.\n__CONTROL__stack-transfer__ في واجهة مركز منصة الفضاء ينقل كومة واحدة يدوياً إلى الكوكب. ستظهر العناصر في [entity=cargo-pod-container] عند إحداثيات البداية.
removing-trash-in-space=يمكن استخدام [entity=inserter] للتخلص من العناصر غير المرغوبة بنقلها إلى فراغ الفضاء.
asteroid-defense=يمكن استخدام [entity=gun-turret] لتفتيت الكويكبات الأكبر إلى قطع كويكبات. يمكن أن يلتقطها [entity=asteroid-collector] لتُعالج على المنصة للحصول على الموارد. الكويكبات الأكبر تضر المنصة عند الاصطدام.
space-science=في عصر الفضاء، لا يمكن إنتاج [item=space-science-pack] إلا على منصة الفضاء باستخدام قطع الكويكبات المعالجة.
spoilables=للعنصر ذي خاصية التلف [img=utility/tooltip_category_spoilable] عمر محدود. عند انتهاء الوقت يتلف العنصر ويتحول إلى عنصر آخر، مثل [item=spoilage].\nالعنصر ذو الجودة الأعلى يبقى طازجاً مدة أطول.
spoilables-result=تقدم تلف المكوّن يؤثر في تقدم تلف المنتج.
spoilables-research=تقل قيمة [item=agricultural-science-pack] كلما زاد تلفها.
