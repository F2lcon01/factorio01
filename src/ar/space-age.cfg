[entity-description]
cargo-landing-pad=ينشئ نقطة هبوط لجميع العناصر التي تطرح من المنصات الفضائية في المدار. يقدم طلبات لوجستية لعناصر من المنصات الموجودة في المدار.
offshore-pump=كوكب شديد النشاط بركاني
turbo-underground-belt=يُستخدم لتمكين الحزام من عبور الكيانات أو التضاريس التي لا يمكن اجتيازها.
turbo-splitter=يدمج أو يفصل حمولة أحزمة النقل 1:1.
rocket-silo=تستخدم لإطلاق العناصر و اللاعبين إلى المنصات الفضائية.
cargo-bay=يزيد حجم مخزون المركز ومنصة الهبوط، ويضيف فتحة شحن إضافية.
landing-pad-unloading-bay=يسمح للأذرع الآلية بأخذ العناصر من المخزون المشترك عند ربطه بمنصة هبوط الحمولة.
cargo-pod=تُستخدم لنقل العناصر من منصة الفضاء إلى سطح الكوكب.\nتُطلق تلقائياً عند وصول منصة فضاء إلى المدار إذا كانت [entity=cargo-landing-pad] تطلب حمولة.\nيمكن إرسالها يدوياً بـ __CONTROL__stack-transfer__ على أيقونة العنصر في واجهة مركز منصة الفضاء.
cargo-pod-container=تظهر على سطح الكوكب ومعها الحمولة من منصة الفضاء، وتُدمَّر عند إفراغ الحمولة.\nعند بناء [entity=cargo-landing-pad] تتوقف كبسولات التوصيل عن الوصول إلى الإحداثيات الأولية، وتُسلَّم الحمولة إليها مباشرة.
big-mining-drill=حفارة أقوى مع مساحة تعدين كبيرة. يمكنها استخراج الخامات الأصعب.
agricultural-tower=النباتات والبذور والمحاصيل النباتية ناضجة.
asteroid-collector=يجمع قطع الكويكبات. يجب أن تفتّت الأبراجُ الكويكباتِ الأكبر إلى قطع.
captive-biter-spawner=هذا المخلوق يحتاج إلى طعام وسوف يجوع ببطء إذا لم يتم تغذيته. سوف يتحول عند التجويع. يمكن القبض عليه عن طريق استهداف [entity=biter-spawner] باستخدام [item=capture-robot-rocket]
capture-robot=الرسم البياني على [entity=biter-spawner] المستهدف في [entity=captive-biter-spawner].
capture-robot-rocket=الرسم البياني على [entity=biter-spawner] المستهدف في [entity=captive-biter-spawner].
crusher=يمكن أن تسحق بعض المواد، مثل الكويكبات، في أجزاء أصغر.
cryogenic-plant=مهم جدًا لأبحاث وعمليات التبريد العميق.
electromagnetic-plant=• أهمية حاسمة للبحوث والعمليات الكهرومغناطيسية.
foundry=يسمح بوصفات الصهر والمعادن الجديدة.
fusion-reactor=يستخدم هيدروكربوني مع خلايا الطاقة الاندماجية لتوليد البلازما.
fusion-generator=يستهلك البلازما لإنتاج الطاقة الكهربائية.
heating-tower=يولد الحرارة من الوقود الكيميائي بكفاءة عالية جدا. لا يتوقف عن الحرق عند درجة حرارة قصوى. ينقل الحرارة إلى أنابيب حرارية متصلة يمكن استخدامها في الطاقة البخارية أو لمنع التجميد.
lightning-collector=يحمي مساحة كبيرة من الضربات البرقية ويحول الطاقة إلى شبكة كهربائية.
lightning-rod=يحمي منطقة صغيرة من الضربات البرقية ويحول الطاقة إلى شبكة كهربائية.
railgun-turret=برج مدفع كهربائي بعيد المدى. فعال ضد الأعداء والكويكبات.
thruster=يسمح للمنصات الفضائية بالسفر إلى كواكب أخرى. يجب بناؤها على الحافة الجنوبية للمنصة الفضائية.
tesla-turret=تكهرب عدو قريب. يمكن أن يرتد المسطح الكهربائي إلى أعداء ثانويين في سلسلة من السلسلة.
jellystem=كائن شنيع من كوكب حليبا
yumako-tree=شجرة من غليبا تنتج ثمار يوماكو المغذية.
space-platform-hub=يُعد مركز المنصة جوهر المنصة الفضائية. فهو يستقبل البضائع من الكواكب ويوزعها على منصات هبوط الشحن. ويتم إنشاؤه عن طريق تشغيل [item=space-platform-starter-pack].
lightning=البرق هو ظاهرة طبيعية تؤدي إلى إتلاف الكيانات غير المحمية وشخصية اللاعب. وفي الوقت نفسه، يمكن استخدامه كمصدر للطاقة.
stack-inserter=ذراع كومة آلي قادر على تعبئة أحزمة النقل بطبقات
fulgoran-ruin-attractor=يَحمي منطقة صغيرة من ضربات البرق
small-demolisher=مخلوق إقليمي هائل مع التجديد الكبير. لا يحب أن يكون مضطربا.
medium-demolisher=مخلوق إقليمي هائل مع التجديد الكبير. لا يحب أن يكون مضطربا.
big-demolisher=مخلوق إقليمي هائل مع التجديد الكبير. لا يحب أن يكون مضطربا.
