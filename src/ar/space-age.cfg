[technology-description]
space-platform=عالج قطع الكويكبات إلى مواد مفيدة.
bioflux=قد يكون لمزيج من النباتات المختلفة استخدامات كثيرة.
bioflux-processing=استخدام البيوفلكس للحصول على المواد الكيميائية بطريقة بيولوجية.
bacteria-cultivation=كاثر البكتيريا بتغذيتها ببعض البيوفلكس.
artificial-soil=أنشئ تربة لزراعة المزيد من النباتات.
rocket-silo=تُستخدم لإطلاق العناصر واللاعبين إلى منصات الفضاء.
stack-inserter=أذرع آلية كومية قادرة على وضع العناصر على أحزمة النقل في كومات متراصة، لكنها تنتظر امتلاء يدها قبل أن تتحرك.
belt-capacity=زيادة ارتفاع الكومات المتراصة من العناصر على أحزمة النقل.
space-science-pack-space-age=إنتاج [item=space-science-pack] على منصة الفضاء.
space-platform-thruster=يتيح لمنصات الفضاء الانتقال إلى كواكب أخرى.
planet-discovery-vulcanus=كوكب بركاني حار ببراكين جبلية وأنهار من الحمم وسهول من الرماد ونافورات حمض الكبريتيك. غني بالمعادن. لا يمكن عبور الحمم إلا بالسكك الحديدية المرتفعة.
planet-discovery-gleba=كوكب رطب كثير المستنقعات العميقة. يمكن للأراضي الرطبة أن تدعم الزراعة لكن البناء عليها صعب، ويمكن ردمها لكن الحجر نادر.\nالتلال المتعرجة فيها حجر وأنسب للبناء، لكنها لا تدعم الزراعة.
planet-discovery-fulgora=كوكب جاف تجتاحه الرياح، تضرب العواصف البرقية هضابه، وفيه محيطات نفطية يمكن عبورها بالسكك الحديدية المرتفعة.\nيبدو أن فيه بعض الأطلال.
planet-discovery-aquilo=أرض قاحلة متجمدة بمحيطات بلا قاع من الأمونيا السائلة لا يمكن ردمها. الجبال الجليدية غير المستقرة هي أقرب شيء إلى أرض صلبة، ويمكن توسيعها بمنصة جليدية عائمة. تتجمد المباني والأحزمة إن لم تُدفّأ بأنابيب نقل الحرارة المجاورة أو مبانٍ ساخنة أخرى، ولكن يجب وضعها على الخرسانة حتى لا يذوب الجليد تحتها.
electric-weapons-damage=يزيد ضرر الأشعة الكهربائية.
artillery-shell-damage=يزيد ضرر المدفعية الثقيلة.
battery-mk3-equipment=تُركّب في الدرع لتخزين كميات هائلة من الطاقة لاستخدامها لاحقاً.
fusion-reactor-equipment=يُركّب في الدرع لتزويد المعدات الأخرى بالطاقة.
