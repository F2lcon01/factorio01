stellar-discovery-solar-system-edge=النهاية! أو بالأحرى بداية جديدة. بناء منصة فضاء قادرة على النجاة هذا البعد عن الأمان النسبي لموقع التحطم يثبت قدرتك على السفر إلى أي مكان آخر في أعماق الفضاء العظيمة بين النجوم. لتنجو منصة فضاء من هذه الرحلة، يجب أن تكون مكتفية ذاتياً على نحو خاص، وأن تملك الأدوات اللازمة لتحويل الكويكبات الكبيرة الخطرة على طول الطريق إلى موارد قابلة للاستخدام.
