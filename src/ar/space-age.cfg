[factoriopedia-description]
fusion-generator=يستهلك البلازما من [entity=fusion-reactor] لتوليد الطاقة الكهربائية. إنتاج الطاقة ثابت، لكن يُستهلك قدر أقل من البلازما إذا كانت حرارتها أعلى. يُخرج مبرداً ساخناً بقدر البلازما المستهلكة، ويمكن تبريده في [entity=cryogenic-plant]. يمكن ربط مولدات الاندماج ببعضها لتتناقل البلازما.
fusion-reactor=يستخدم مبرد الفلوروكيتون مع خلايا طاقة الاندماج لإنتاج بلازما فائقة الحرارة. لا يمكن إخراجها إلا مباشرة إلى [entity=fusion-generator]. مكافأة الجوار مع مفاعلات الاندماج الأخرى ترفع حرارة البلازما كثيراً دون زيادة كمية المبرد المستخدم.
