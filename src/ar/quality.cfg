[tips-and-tricks-item-description]
quality=تحسّن الجودة جوانب معينة من الكيانات والعناصر والمعدات.\nلكل كيان صحة أعلى كلما ارتفعت جودته.\nيحصل كل نوع كيان (عدا بعض [tooltip=الاستثناءات,tips-and-tricks-item-description.quality-bonus-exceptions]) على مكافأة فريدة خاصة به، مثل مدى أعمدة الكهرباء في هذا المثال.\nالعناصر التي يمكن استخدامها كبلاط قابل للبناء لا تستفيد من الجودة إلا كجزء من وصفات أخرى، وتعود إلى الجودة العادية عند وضعها كبلاط.
quality-bonus-exceptions=استثناءات مكافأة الجودة:\n[entity=transport-belt] حزام النقل \n[entity=pipe] الأنابيب \n[entity=straight-rail] سكة حديدية
quality-factoriopedia=تُميَّز خصائص الكيانات والعناصر والمعدات بأيقونة [img=quality_info] في التلميح. \nعند فتح الكائن المرتبط في موسوعة فاكتوريو (__CONTROL__open-factoriopedia__)، يمكن التمرير فوق الأيقونة لإظهار القيم المحددة.
quality-modules=[tooltip=وحدات الجودة,tips-and-tricks-item-description.quality-module-list] تزيد فرصة إنتاج عناصر بجودة أعلى في [tooltip=كيانات الإنتاج,tips-and-tricks-item-description.production-entity-list].
quality-module-list= وحدة الجودة [item=quality-module]\n وحدة الجودة 2 [item=quality-module-2]\nوحدة الجودة 3 [item=quality-module-3]
quality-probabilities=فرصة إنتاج عنصر بجودة أعلى هي 1% مع [item=quality-module,quality=normal] واحدة، ويمكن أن تصل إلى 25% مع أربع [item=quality-module-3,quality=legendary].\nهناك أيضاً فرصة صغيرة لتخطي مراحل والحصول على جودة أعلى مباشرة كما يظهر في الجدول.
