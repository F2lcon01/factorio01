perf-avg-frames=- عدد الدقائق/التحديثات المستخدمة لمتوسط عدادات الأداء. الافتراضي هو 100. ومن الموصى به أن تكون قيمة 10-5 للتقارب السريع، ولكن الأرقام سوف ترتفع بسرعة أكبر.
