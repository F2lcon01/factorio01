alternative-gui-move-left=مفتاح بديل للتنقل في واجهة المستخدم.
rotate=تدوير العنصر المحتفظ به في المؤشر أو الكيان المحدد باتجاه عقارب الساعة.
reverse-rotate=تدوير العنصر المحتفظ به في المؤشر أو الكيان المحدد عكس اتجاه عقارب الساعة.
shoot-enemy=يطلق النار على أقرب عدو للمؤشر أو لمكان المؤشر في حالة استعمال بعض الأسلحة الأخرى.
shoot-selected=يطلق النار على ما حددته أو لمكان المؤشر في حالة استعمال بعض الأسلحة الأخرى.
cycle-blueprint-forwards=يبدل المخطط المفعل بالمخطط المتاح التالي، عند الاحتفاظ بكتاب مخططات.
cycle-blueprint-backwards=يبدل المخطط المفعل بالمخطط المتاح السابق، عند الاحتفاظ بكتاب مخططات.
cycle-quality-up=يرفع جودة العنصر الموجود حالياً في المؤشر أو في شاشة الاختيار.
cycle-quality-down=يخفض جودة العنصر الموجود حالياً في المؤشر أو في شاشة الاختيار.
toggle-driving=يدخل أو تخرج من المركبة التي تقف بجانبها أو تقودها.
clear-cursor=يرجع العنصر في تكدس المؤشر إلى مخزون اللاعب. كما ألغى وضع الأسلاك وتخطيط السكك الحديدية.
pipette=يأخذ من مخزونك العناصر المستخدمة لبناء الكيان المحدد حالياً ويضعها في المؤشر. أما مع الموارد فيختار أسرع حفار تنقيب متاح.
copy-entity-settings=نسخ الإعدادات من الكيان المحدد. لاحظ أنه من أجل اللصق للعمل، يجب أن يظل الكيان المصدر موجودا.
paste-entity-settings=لصق الإعدادات من الكيان الذي تم نسخه سابقاً.
toggle-rail-layer=عند استخدام مخطط السكك الحديدية، يغير ما إذا كان يجب أن تنتهي السكك على الأرض أم مرتفعة.
remove-pole-cables=يزيل الأسلاك من السماد الكهربائي المحدد، بدءاً بالأسلاك الكهربائية ثم أسلاك الشبكة الدائرية.
cursor-split=نقل نصف خانة المخزون المحددة إلى المؤشر إذا كان فارغاً. يضع عنصر واحد من مكدس المؤشر في فتحة المخزون المحددة عند الضغط على عنصر ما.
stack-transfer=ينقل المكدس المحدد إلى المخزون الآخر.
stack-split=ينقل نصف المكدس المحدد إلى المخزون الآخر.
inventory-transfer=ينقل كل حزم النوع المختار إلى الحاوية الأخرى. إذا تم اختيار مساحة فارغة، يتم نقل جميع حزم العناصر.
fast-entity-transfer=ينقل المكدس المحتفظ به إلى الكيان المحدد، أو يأخذ أي شيء لدى الكيان وينقله إلى المخزون الخاص بك إذا كان المؤشر فارغاً.
inventory-split=ينقل نصف حزم النوع المختار (مقربة للأكبر) إلى الحاوية الأخرى. إذا تم اختيار مساحة فارغة، يتم نقل أنصاف حزم جميع العناصر.
fast-entity-split=ينقل نصف المكدس المحتفظ به إلى الكيان المختار، أو يأخذ نصف أي شيء لدى الكيان وينقله إلى المخزون الخاص بك إذا كان المؤشر فارغاً.
toggle-filter=إنشاء/إزالة عامل تصفية لفتحة المخزون المحددة. يمكن وضع نوع العنصر المحدد فقط في فتحة الفرصة.
craft=يمكن استخدامها فقط في وصفة واجهة المستخدم (GI). صناعة 1 من وصفة معينة.
craft-5=يمكن استخدامها فقط في وصفة واجهة المستخدم (GI). صناعة 5 من وصفة معينة.
craft-all=لا يمكن استخدامها إلا في وصفة واجهة المستخدم (GU). تصنيع أكبر عدد ممكن من وصفة معينة.
cancel-craft=يمكن استخدامها فقط في قائمة انتظار التصنيع.
cancel-craft-5=يمكن استخدامها فقط في قائمة انتظار التصنيع.
cancel-craft-all=يمكن استخدامها فقط في قائمة انتظار التصنيع.
scroll-tooltip-up=تمرير تلميح الكيان لأعلى (ينطبق فقط عندما يكون مثبتاً على الجانب الأيمن من العرض).
scroll-tooltip-down=تمرير التلميح لأسفل (ينطبق فقط عندما يكون مثبتاً على الجانب الأيمن من العرض).
next-weapon=دورات إلى السلاح التالي المجهز.
connect-train=يربط القطار المحدد أو القطار الذي تقوده بأي قطارات مجاورة.
disconnect-train=قطع الاتصال بالعربات المتحركة المختارة أو العربات المتحركة التي تكون فيها من بقية القطار.
larger-terrain-building-area=يزيد من حجم منطقة وضع البلاط.
smaller-terrain-building-area=يقلل حجم منطقة وضع البلاط.
show-info=تبديل تظهر معلومات إضافية عن الكيانات المبنية مثل الوصفات في تجميع الآلات ومحتوى الحاويات.
close-menu=الإلغاء و العودة إلى القائمة السابقة. ممكنة فقط في القائمة الرئيسية.
next-active-quick-bar=يحدد الشريط السريع التالي للشريط السريع الأعلى.
previous-active-quick-bar=يحدد الشريط السريع التالي للشريط السريع الأعلى.
build-with-obstacle-avoidance=يمكن استخدامها فقط لبناء السكك الحديدية. هذا هو نفس وضع بناء الأشباح، ولكن يتم تجنب الأشجار والصخور والهضافات.
