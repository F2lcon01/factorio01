large-blueprint-size=<set/get> <number> - يضبط أو يقرأ الحد الذي يعتبر عنده المخطط «كبيراً» (بالبايت). نسخ المخططات الكبيرة يستخدم النسخة «الكبيرة» من إجراء المُدخلات، والتي يمكن السماح بها أو تعطيلها اختيارياً عبر نظام الأذونات.
[config-help]
name=<name> - يحدد اسم الخادم.
description=<description> - يحدد وصف الخادم (يمكن أن يكون فارغاً).
tags=<tags> - يحدد وسوم الخادم - قائمة من النصوص (يمكن أن تكون فارغة).
afk-auto-kick=<number> - يحدد المدة (بالدقائق) التي يجب أن يبقى فيها اللاعب غير نشط قبل طرده تلقائياً. القيمة 0 تعني التعطيل.
allow-commands=<true/false/admins-only> - يحدد ما إذا كانت أوامر Lua مسموحة.
allow-debug-settings=<true/false> - يحدد ما إذا كانت إعدادات التصحيح غير البسيطة مسموحة للاعبين غير المشرفين.
autosave-interval=<number> - يحدد الفاصل الزمني للحفظ التلقائي (بالدقائق). القيمة 0 تعني التعطيل.
autosave-only-on-server=<true/false> - يحدد ما إذا كان الخادم وحده هو من ينشئ ملفات الحفظ التلقائي.
help-list=الخيارات المتاحة هي: __1__.
ignore-player-limit-for-returning-players=<true/false> - يحدد ما إذا كان يتم تجاهل حد عدد اللاعبين في الخادم بالنسبة للاعبين العائدين.
matching-configs-list=إعدادات المطابقة: __1__.
max-players=<number> - يحدد الحد الأقصى لعدد اللاعبين المسموح لهم في هذا الخادم. القيمة 0 تعني عدم وجود حد.
max-upload-speed=<number> - يحدد السرعة القصوى للرفع بالكيلوبايت في الثانية. القيمة 0 تعني عدم وجود حد.
max-upload-slots=<number> - يحدد الحد الأقصى لعدد فتحات الرفع. القيمة 0 تعني عدم وجود حد.
only-admins-can-pause=<true/false> - يحدد ما إذا كان الإيقاف المؤقت للعبة مسموحاً للمشرفين فقط.
auto-pause-when-players-connect=<true/false> - يحدد ما إذا كان الخادم يتوقف مؤقتاً بشكل تلقائي أثناء اتصال أحد اللاعبين.
password=<password> - يحدد كلمة مرور اللعب الجماعي. كلمة المرور الفارغة تعني عدم وجود كلمة مرور.
require-user-verification=<true/false> - يحدد ما إذا كان يجب تأكيد هوية المستخدم للانضمام إلى الخادم.
visibility-lan=<true/false> - يحدد ما إذا كانت اللعبة مرئية على الشبكة المحلية (LAN).
visibility-steam=<true/false> - يحدد ما إذا كان بإمكان الأصدقاء الانضمام عبر Steam.
visibility-public=<true/false> - يحدد ما إذا كانت اللعبة مرئية للعامة.
