swap-players=<player> <player> - يبادل الشخصيات بين اللاعبين المحددين. إن لم يحدد اللاعب الثاني فهو أنت.
time=- يطبع معلومات عن مدى عمر الخريطة.
toggle-action-logging=- إضهار تسجيل جميع إجراءات الإدخال التي تؤديها اللعبة. هذه القيمة لا تستمر بعد إعادة تشغيل اللعبة وتؤثر فقط على لعبتك المحلية في جلسات متعددة اللاعبين.
toggle-heavy-mode=- سيتم استخدام هذا الأمر بحذر لأنه سيجعل اللعبة متعددة اللاعبين غير قابلة للتشغيل مرة واحدة. تبدأ اللعبة في حفظ ومقارنة اللعبة مع نفسها كل علامة للبحث عن تناقضات في الحتمية. ينصح باستخدام هذا الأمر عندما يكون هناك حلقة غير متزامنة في حالة إنضمام لاعب جديد إلى الخادم. سيتم تشغيل الوضع الثقيل حتى يظهر شيئاً ما. يرجى تزويدنا به حتى نتمكن من التحقيق وحل المشكلة.
unban=<player> - يرفع الحظر عن اللاعب المحدد.
unignore=<player> - يسمح للدردشة بعرض رسائل هذا اللاعب.
unknown-command=أمر غير معروف __1__
unmute=<player> - يسمح للاعب بالتحدث في الدردشة مجدداً.
version=- يطبع نسخة اللعبة الحالية.
whisper=<player> <message> - يرسل رسالة إلى اللاعب المحدد.
whitelist=<enable/disable/add/remove/get/clear> <player> - يفعل القائمة البيضاء أو يعطلها، أو يضيف لاعباً إليها أو يزيله منها، وعندها لا ينضم إلى اللعبة إلا اللاعبون المدرجون فيها. لا تدخل شيئاً مكان 'player' عند استخدام 'get' لعرض قائمة بجميع اللاعبين المدرجين في القائمة البيضاء.
editor=- تبديل محرر الخريطة.
cheat=<all> - يبحث جميع التقنيات ويشغل وضع الغش. استخدام الخيار <all> يمنح اللاعب أيضاً بعض العناصر الإضافية.\n <planet-name> - ينقل اللاعب إلى الكوكب المحدد.\n <platform-name> - ينقل اللاعب إلى المنصة المحددة.\n <off> - يوقف وضع الغش.
unlock-shortcut-bar=- فتح جميع عناصر شريط الاختصار.
unlock-tips=فتح جميع النصائح وخدع الإدخالات.
reset-tips=إعادة تعيين حالة النصائح والحيل كما لو أن اللعبة بدأت لأول مرة.
