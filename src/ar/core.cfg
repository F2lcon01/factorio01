measured-command=<command> - ينفذ أمر Lua (إن كان مسموحاً) ويقيس الوقت الذي استغرقه.
mute-programmable-speaker=<mute/unmute> <local/everyone> - يكتم أو يلغي كتم أصوات الكون والسطح الصادرة عن سماعة مبرمجة. استخدم "local" للكتم على جهازك المحلي فقط. يمكن للمشرفين استخدام "everyone" لكتم الأصوات لكل من على الخادم.
mute=<player> - يمنع اللاعب من قول أي شيء في الدردشة.
