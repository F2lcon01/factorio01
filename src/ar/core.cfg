[gui-graphics-settings-description]
minimize-on-focus-loss=عند التشغيل في شاشة كاملة، سوف تقلل اللعبة من إستهلاك الموارد للتأكد من أنها لا تغطي سطح المكتب الخاص بك عندما تريد التحول إلى تطبيق مختلف.
max-threads=عدد المسارات المستخدمة لمعالجة اللعبة.
graphics-quality-label=دقة الكائنات. يحدد استخدام VRAM. تحذير: دقة "عالية" تتطلب 3 جيجابايت على الأقل من VRAM.
show-animated-water=تعطيل لزيادة الأداء بالنسبة لكروت الشاشة منخفضة الأداء.
show-tree-distortion=تعطيل لزيادة الأداء بالنسبة لكروت الشاشة منخفضة الأداء.
lights-quality=اظهار الأضواء خلال الليل بشكل جيد. القيم العالية سوف تقلل من الأداء بشكل كبير.
show-smoke=عند التعطيل، سيتم تقليل تأثيرات الدخان التي يتم توفيرها بشكل كبير. قم بتعطيل هذا الخيار لزيادة الأداء على كروت الشاشة الضعيفة.
video-memory-usage-label=يحدد عدد الكائنات التي تحاول اللعبة وضعها في مساحة الكائن. إنشاء مساحة أكبر يقلل من استخدام المعالج بسبب القدرة على الرسم أسرع، ولكن قد تزيد من الحمل على الGPU لأنه يجب أن يعمل مع تشابك بصري أوسع. يمكن تحميل الكائنات العائمة الحرة في VRAM أو الاحتفاظ بها في ذاكرة الوصول العشوائي (انظر إعدادات التشابك البصري).
video-memory-budget-label=الحد الأقصى لحجم ذاكرة الفيديو (VRAM) المسموح للعبة باستخدامها في معالجة التشابك البصري (sprites).
texture-streaming=ستبقى الكائنات التي لم توضع في تشكيل كائن (انظر إعدادات استخدام ذاكرة الفيديو) في ذاكرة الوصول العشوائي حتى يحتاجها الGPU.
texture-compression=ضغط التشابك البصري يزيد بشكل كبير عدد الكائنات التي يمكن أن تتناسب مع ذاكرة الفيديو، وتسرع في العمل بسبب اضطرار GPU إلى نقل قدر أقل من البيانات أثناء رسم الظلال. إذا كان لديك GPU قديم أو مدمج مع المعالج، حدد جودة منخفضة لتقليل حجم الكائنات للحصول على أداء أفضل.
sprite-atlas-size-label=الرسومات الكبيرة سريعة الإستدعائ، مما يقلل الضغك على وحدة المعالجة المركزية في المعالجة، ولكن قد يكون من الصعب التعامل معها في الGPU.
high-quality-animations=في حالة التعطيل، فإن بعض الكيانات المتحركة أو المدارة (على سبيل المثال القطار) لن تحمّل سوى نصف العدد العادي من الإطارات المتحركة. هذا يقلل بشكل كبير من استخدام VRAM.
full-color-depth=معالجة فقط نصف عمق الألوان (bit-16) يزيد الأداء في كروت الشاشة منخفضة الأداء أو المدمجة مع المعالج,  هذا الخيار له تأثير فقط على Windows 8+ أو في OpenGL.
render-in-native-resolution=على شاشات عالية الدقة أو التباين (مثل Apple Retina)، فإن المعالجة وفقت لأبعادها سينتج صور عالية الجودة ولكنها سوف تكون على حساب إمكانيات الجهاز.
use-flip-presentation-model=ينبغي أن يكون العرض العرضي الطريقة الأكثر كفاءة لعرض الصورة النهائية على الشاشات من الجيل القديم. حاول تبديل هذا الخيار إذا كنت تواجه مشكلات في الرسوم أو مشكلات في الإطارات.
show-game-simulations-in-background=في القائمة الرئيسية والقوائم الفرعية، تظهر محاكاة للعبة في الخلفية.
