vram-low-high-quality-not-recommended=اكتشفنا أن هذا الكمبيوتر يحتوي على __1__ ميغابايت من ذاكرة الفيديو (VRAM). هذا منخفض جدا بالنسبة للكائنات ذات الجودة العالية. قد تواجه مشاكل في الأداء، أو الرسومات الناقصة، أو الأعطال أو اللعبة قد لا تكون قادرة على البدء على الإطلاق. حجم ذاكرة الفيديو الموصى به للكائنات ذات الجودة العالية هو 2 جيجابايت على الأقل.
