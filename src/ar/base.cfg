[tips-and-tricks-item-description]
show-info=اضغط على __CONTROL__show-info__ لتبديل تراكب المعلومات المفصلة، المعروفة أيضًا باسم "وضع الكل".
e-confirm=يمكن تأكيد جميع الأزرار الخضراء في اللعبة باستخدام __CONTROL__confirm-gui__.
clear-cursor=عند الإمساك بعنصر، يمكنك إفراغ المؤشر منه باستخدام __CONTROL__clear-cursor__، فيعود إلى خانة [img=utility/hand] في المخزون المصدر.\nكما يلغي تخطيط مسار سكة حديدية، وسحب الأسلاك، ومربعات التحديد.
pipette=استخدم __CONTROL__pipette__ لوضع الكيان المحدد في المؤشر.\nعند استخدامه في العرض البعيد، سيوضع شبح الكيان المحدد في المؤشر بدلًا من ذلك.
z-dropping=اضغط __CONTROL__drop-cursor__ لإسقاط عنصر واحد في كل مرة من المؤشر.\nيمكنك الإسقاط على الأرض، وعلى الأحزمة، وداخل الكيانات.\nاضغط مع الاستمرار على __CONTROL__drop-cursor__ واسحب المؤشر عبر عدة كيانات لإسقاط عنصر واحد بسرعة في كل منها.
stack-transfers=ينقل __CONTROL__stack-transfer__ كومة واحدة.\nينقل __CONTROL__inventory-transfer__ كل الكومات من النوع المحدد. (اختيار خانة فارغة ينقل المخزون بالكامل.)\nاستخدام __CONTROL_RIGHT_CLICK__ بدلًا من __CONTROL_LEFT_CLICK__ مع عناصر التحكم المذكورة أعلاه ينقل نصف الكمية.\n\nيشرح الدرس التعليمي ذلك بمزيد من التفصيل.
entity-transfers=اضغط __ALT_CONTROL__1__fast-entity-transfer__ على كيان لأخذ العناصر منه.\nاضغط __ALT_CONTROL__1__fast-entity-transfer__ وأنت تمسك بعنصر لوضعه في الكيان المحدد.\n\n\nيعلمك الدرس التعليمي طرقًا مختلفة لنقل العناصر إلى الكيانات ومنها دون فتحها.
shoot-targeting=يمكنك إطلاق النار على أهداف العدو بالضغط على __CONTROL__shoot-enemy__ مع وضع المؤشر قرب العدو.\nيمكنك إطلاق النار على كيان محايد أو صديق محدد بالضغط على __CONTROL__shoot-selected__.
shoot-targeting-controller=يمكنك إطلاق النار على أهداف العدو بالضغط مع الاستمرار على __CONTROL__shoot-enemy__.\nعند استخدام يد التحكم، ستصوب جميع الأسلحة تلقائيًا نحو أقرب عدو في المنطقة. استخدم __CONTROL__look__ لتحريك منطقة الاستهداف التلقائي.\nيمكنك إطلاق النار على كيان محايد أو صديق محدد بالضغط على __CONTROL__shoot-selected__.
bulk-crafting=عند التمرير فوق خانة صنع:\n - __ALT_CONTROL__1__craft-5__ لصنع 5.\n - __ALT_CONTROL__1__craft-all__ لصنع أكبر قدر ممكن.
entity-flip=يمكن قلب معظم الكيانات أفقيًا باستخدام __CONTROL__flip-horizontal__ أو عموديًا باستخدام __CONTROL__flip-vertical__. يمكنك قلب العناصر التي في يدك، أو التمرير فوق كيان لقلبه في مكانه.
inserters=تلتقط الأذرع الآلية العناصر من جهة وتضعها على البلاطة المقابلة.\nيمكنها نقل العناصر من وإلى [entity=transport-belt] و[entity=iron-chest] و[entity=burner-mining-drill] و[entity=stone-furnace] وغيرها من الآلات.
burner-inserter-refueling=ويمكن إعادة تغذية [entity=burner-inserter] بآلات أخرى، ولكن يمكنها أيضا أن تعيد التزود بالوقود عند العمل بالوقود.
long-handed-inserters=[entity=long-handed-inserter] ذراع آلي كهربائي يلتقط العناصر ويضعها على بعد بلاطتين من موقعه بدلًا من البلاطة الواحدة المعتادة.
move-between-labs=يمكن استخدام [entity=inserter] لنقل حزم العلوم بين [entity=lab].
insertion-limits=لا يملأ الذراع الآلي مخزون الهدف بالكامل دائمًا. يتيح هذا للأذرع الآلية الأخرى التقاط نصيبها من العناصر.\nعلى سبيل المثال، إذا احتوى [entity=boiler] على 5 وحدات أو أكثر من [item=coal]، فلن يضع فيه أي ذراع آلي المزيد. يتيح هذا لبقية الوقود أن يتقدم على حزام النقل إلى مبخرات المياه الأخرى، بدلًا من أن يستحوذ الأول في الطابور على كل شيء.\nينطبق هذا أيضًا على [entity=gun-turret] و[entity=assembling-machine-1] و[entity=stone-furnace] و[entity=lab] وغيرها.
limit-chests=يمكن تقييد خانات المخزون المتاحة في الصناديق باختيار خانة المخزون ذات العلامة "X" الحمراء، ثم حظر الخانات المطلوبة.\nلن تتمكن الأذرع الآلية من ملء الخانات المحظورة، فيقلل ذلك من سعة الصناديق ويمنع الإفراط في الإنتاج.
belt-lanes=يحتوي [entity=transport-belt] على مسارين يمكن استخدامهما لنقل العناصر، ويمكن تخصيصهما لموارد مختلفة.\nيستطيع [entity=inserter] التقاط العناصر من كلا المسارين، لكنه يضعها على المسار البعيد فقط.
splitters=يُستخدم [entity=splitter] لتقسيم الأحزمة أو دمجها أو موازنتها.\nتتوزع العناصر الواردة بالتساوي إذا توفرت مساحة فارغة في كلا المُخرجين، وإلا فتتجه إلى أي مُخرج متاح.\nيمكن ضبطه لتصفية عنصر معين، أو لإعطاء الأولوية لأحد المُدخلين أو المُخرجين.
electric-network=تنقل الشبكات الكهربائية الطاقة من المنتجين مثل [entity=steam-engine] أو [entity=solar-panel] إلى المستهلكين بالتساوي.\nاضغط __ALT_CONTROL__1__open-gui__ على عمود كهربائي لعرض إحصائيات شبكته الكهربائية.
steam-power=يستهلك [entity=boiler] الوقود القابل للاحتراق مثل [item=coal] لتحويل [fluid=water] إلى [fluid=steam].\nيستهلك [entity=steam-engine] [fluid=steam] لإنتاج الطاقة الكهربائية، التي تتوزع على المستهلكين في الشبكة الكهربائية.
connect-switch=اضغط __ALT_CONTROL__1__build__ على كيان مع وجود [shortcut=give-copper-wire] في المؤشر لتوصيل كابل كهربائي به.\nاضغط __ALT_CONTROL__1__remove-pole-cables__ على كيان لإزالة جميع الكابلات.
low-power=إذا كان استهلاكك للطاقة أكبر من قدرة الإنتاج لديك، فستعمل آلات مصنعك ببطء أكبر بسبب نقص الإمداد.\nراقب السرعة التي تعمل بها آلاتك إن أردت اكتشاف نقص إنتاج الطاقة قبل فوات الأوان.\nأفضل طريقة للتأكد من امتلاكك طاقة كافية هي التحقق من إحصائيات الشبكة الكهربائية والتأكد من أن شريط 'الطاقة المطلوبة' أخضر وممتلئ.
electric-pole-connections=تتصل الأعمدة الكهربائية تلقائيًا بالأعمدة الكهربائية الأخرى الواقعة ضمن 'امتداد السلك' الخاص بها.\nيمكن إضافة الاتصالات أو إزالتها يدويًا باستخدام [shortcut=give-copper-wire].\nيمكن إزالة جميع اتصالات العمود الكهربائي باستخدام __CONTROL__remove-pole-cables__ على العمود الكهربائي.
copy-entity-settings=يتيح لك __CONTROL__copy-entity-settings__ و__CONTROL__paste-entity-settings__ نسخ الإعدادات بين الكيانات.\nعلى سبيل المثال، يمكنك النسخ واللصق بين [entity=assembling-machine-2] لتعيين الوصفة، أو بين الصناديق لتعيين حد المخزون.\nاضغط __ALT_CONTROL__1__paste-entity-settings__ واسحب للصق الإعدادات على عدة كيانات بحركة واحدة.
copy-entity-settings-controller=يتيح لك __CONTROL__copy-entity-settings__ و__CONTROL__paste-entity-settings__ نسخ الإعدادات بين الكيانات.\nعلى سبيل المثال، يمكنك النسخ واللصق بين [entity=assembling-machine-2] لتعيين الوصفة، أو بين الصناديق لتعيين حد المخزون.\nاضغط مع الاستمرار على __CONTROL__paste-entity-settings__ وتحرك باستخدام __CONTROL__move__ للصق الإعدادات بسرعة على عدة كيانات.
copy-paste-trains=يمكنك النسخ واللصق بين [entity=locomotive] لنسخ الجدول الزمني واللون.\nيمكنك النسخ واللصق بين [entity=train-stop] لنسخ اسم المحطة واللون.\nوأخيرًا، يمكنك النسخ واللصق بين [entity=locomotive] و[entity=train-stop] في أي اتجاه لنسخ اللون.
copy-paste-filters=يمكنك نسخ ولصق بين الكائنات باستخدام فلاتر قابلة للتخصيص، الطلبات، أو فتحات المخزون المفلترة، مثل [entity=requester-chest] ،[entity=splitter] ،[entity=fast-inserter] أو [entity=cargo-wagon].
copy-paste-requester-chest=يمكنك النسخ واللصق بين [entity=requester-chest] لنسخ الطلبات اللوجستية.\nيمكنك أيضًا النسخ من [entity=assembling-machine-2] واللصق في [entity=requester-chest] لتعيين الطلب اللوجستي بناءً على الوصفة.
copy-paste-spidertron=النسخ واللصق بين [entity=spidertron] ينسخ اللون والطلبات اللوجستية.\nكما يحاول نسخ شبكة المعدات، فيضع المعدات من مخزون اللاعب إذا كانت العناصر متوفرة.
drag-building=أسرع طريقة للبناء في خط مستقيم، مثل إعداد [entity=stone-furnace]، هو إلى __CONTROL__build__ واستمر أثناء الركض في الاتجاه المطلوب.
drag-building-poles=إذا بنيت [entity=small-electric-pole] بالسحب، فسيبنى تلقائيًا على أقصى مسافة اتصال.
pole-dragging-coverage=إذا قمت ببناء [entity=small-electric-pole] بسحب الماكينات الكهربائية، لن يتم تخطي أي مجال من النطاق.
drag-building-underground-belts=إذا قمت ببناء [entity=underground-belt] أو [entity=pipe-to-ground] بسحب البحر، فسيتم بناؤه تلقائياً على مسافة الاتصال القصوى.
fast-belt-bending=يسمح الضغط __CONTROL__rotate__أثناء السحب [entity=transport-belt]بثني الحزام بسرعة وبسلاسة.
fast-obstacle-traversing=عند سحب [entity=transport-belt] فوق عائق، يبنى [entity=underground-belt] تلقائيًا للعبور متى أمكن ذلك.
usable-items=يمكن استخدام بعض العناصر بطرق أخرى غير بناء الكيانات في العالم. على سبيل المثال، يمكنك رمي [item=grenade] على الأعداء لإلحاق الضرر بهم.\nاضغط __ALT_CONTROL__1__build__ وأنت تمسك بعنصر قابل للاستخدام في المؤشر لتنفيذ تأثيره.
repair-packs=أثناء الضغط على [item=repair-pack] في المؤشر، اضغط على __CONTROL__build__ مع الاستمرار على أحد الكيانات لإصلاحه.
trains=القطارات مفيدة للنقل بسعة عالية ولمسافات طويلة.\nيمكن ركوب القطارات باستخدام __CONTROL__toggle-driving__، وقيادتها باستخدام __CONTROL_MOVE__.
rail-building=لتفعيل وضع بناء السكك الحديدية، أمسك [item=rail] واضغط __CONTROL__build__ فوق قطعة سكة حديدية موجودة.\nاضغط __ALT_CONTROL__1__build__ لتأكيد وضع قطعة السكة الحديدية المطلوبة.\nيعطل __CONTROL__clear-cursor__ وضع بناء السكك الحديدية.
train-stops=تُستخدم [entity=train-stop] لأتمتة نقل العناصر بالقطارات عبر توفير مواقع قابلة للتسمية تسافر إليها القطارات.\n\n\n\nيعلمك الدرس التعليمي كيفية بناء محطة قطار، وكيفية ضبط جدول زمني بسيط للقطار.
rail-signals-basic=تقسم [entity=rail-signal] السكك الحديدية إلى قطاعات. سيقرأ كل [entity=locomotive] إشارات السكك الحديدية لتجنب الاصطدام بالقطارات الأخرى.\n\n\n\nيعلمك الدرس التعليمي كيفية استخدام إشارات السكك الحديدية لتشغيل عدة قطارات على نظام سكة حديدية واحد.
rail-signals-advanced=تحدد [entity=rail-chain-signal] حالتها بناءً على الإشارات التي أمامها لضمان أن القطار الذي يدخل قطاعًا ما سيتمكن من مغادرته.\nتُستخدم مع [entity=rail-signal] لبناء تقاطعات سكة حديدية متقدمة.\n\n\nيعلمك الدرس التعليمي كيفية استخدام إشارات سلسلة السكك الحديدية لبناء تقاطعات سكك حديدية معقدة ومنع الانسدادات.
gate-over-rail=يمكن بناء [entity=gate] فوق أي [entity=straight-rail] عمودية أو أفقية.\nستفتح القطارات البوابة تلقائيًا لتمر، ولن تترك ثغرة في دفاعاتك.
pump-connection=ستتصل [entity=pump] مع [entity=fluid-wagon] متوقفة.\nوهي ضرورية لتحميل السوائل وتفريغها من [entity=fluid-wagon].
train-stop-same-name=يمكن أن تشترك [entity=train-stop] في اسمها مع محطات أخرى. ستتمكن القطارات التي يتضمن جدولها هذا الاسم من استهداف أي من هذه المحطات كوجهة لها.\nيمكنك تعيين حد القطارات لكل محطة قطار للتحكم في هذا السلوك بدقة أكبر.
logistic-network=الشبكة اللوجستية شبكة توصيل آلية قوية تستخدم روبوتات طائرة لنقل العناصر وتنفيذ البناء الآلي.\nلها 3 مكونات رئيسية:\n - [entity=roboport] يحدد منطقة تغطية الشبكة، ويعمل نقطة شحن وتخزين للروبوتات.\n - [entity=logistic-robot] ينفذ الأوامر اللوجستية، و[entity=construction-robot] ينفذ أوامر البناء.\n - [tooltip=صناديق المزود,tips-and-tricks-item-description.storage-chest-list] تزود الشبكة بالعناصر.
storage-chest-list=الصناديق التي توفر محتوياتها مرتبة حسب الأولوية:\n[entity=active-provider-chest] صندوق مزود نشط\n[entity=buffer-chest] صندوق مؤقت\n[entity=storage-chest] صندوق تخزين\n[entity=passive-provider-chest] صندوق مزود خامل
personal-logistics=ينقل [entity=logistic-robot] العناصر من صناديق المزود اللوجستية لتلبية الطلبات اللوجستية الشخصية.\nللطلب اللوجستي الشخصي حد أدنى وحد أقصى للعدد، وستجلب الروبوتات العناصر حتى يصبح لديك أكثر من الحد الأدنى.\nإذا كان لديك أكثر من الحد الأقصى، فستنتقل العناصر إلى فتحات المهملات اللوجستية لتأخذها الروبوتات.
construction-robots=ينفذ [entity=construction-robot] أوامر البناء والتفكيك والترقية والإصلاح الصادرة من الشبكة اللوجستية.\nتنشأ أوامر البناء عن البناء الشبحي، أو استخدام [item=blueprint]، أو عند تدمير مبنى صديق واحتياجه إلى إعادة البناء.\nتنشأ أوامر التفكيك عند تحديد الكيانات المطلوبة بواسطة [item=deconstruction-planner].\nتنشأ أوامر الترقية عند استخدام [item=upgrade-planner].\nتنشأ هذه الأوامر أيضًا عند استخدام ميزة التراجع.
passive-provider-chest=يقدم [entity=passive-provider-chest] عناصره إلى الشبكة اللوجستية.\nهذا يعني أن الروبوتات يمكنها أخذ أي عناصر موجودة في صناديق المزود غير العاملة لتلبية الأوامر اللوجستية أو أوامر البناء.
storage-chest=يخزن [entity=storage-chest] العناصر المأخوذة من فتحات المهملات لدى اللاعبين ومن أوامر التفكيك.\nكما تتاح أي عناصر في صناديق التخزين للاستخدام في الأوامر اللوجستية أو أوامر البناء.\nيمكن ضبط مرشح لصناديق التخزين لتقبل نوعًا واحدًا فقط من العناصر.
requester-chest=يطلب [entity=requester-chest] العناصر من الشبكة اللوجستية.\nسينقل [entity=logistic-robot] العناصر من الشبكة اللوجستية لتلبية الطلبات.
active-provider-chest=يحاول [entity=active-provider-chest] بنشاط دفع عناصره إلى الشبكة اللوجستية.\nإذا لم تكن هناك طلبات لعنصر موجود في صندوق مزود نشط، فسينتقل إلى [entity=storage-chest].
buffer-chest=يعمل [entity=buffer-chest] بوصفه [entity=requester-chest] و[entity=passive-provider-chest] في آن واحد.\nيوفر العناصر لمهام البناء والخدمات اللوجستية الشخصية وصناديق الطلب التي يكون فيها خيار 'طلب من المخزن المؤقت' مفعلًا.
ghost-building=اضغط __ALT_CONTROL__1__build-ghost__ وأنت تمسك بعنصر قابل للبناء لبنائه على هيئة كيان الشبح.\nستبني أي شبكة لوجستية في النطاق كيانات الشبح تلقائيًا.
ghost-rail-planner=يُستخدم مخطط السكك الحديدية الشبحي لتخطيط امتدادات طويلة من أشباح السكك الحديدية الجديدة.\nلاستخدام المخطط الشبحي، اضغط مع الاستمرار على __CONTROL_MODIFIER__build-ghost__ أثناء تخطيط السكك الحديدية.\nيمكنك أيضًا الضغط مع الاستمرار على __CONTROL_MODIFIER__build-with-obstacle-avoidance__ لتخطيط سكة حديدية شبحية مع تجنب العوائق.
copy-paste=تتيح لك أداة النسخ (__CONTROL__copy__) حفظ التحديد في الحافظة.\nتستعيد أداة اللصق (__CONTROL__paste__) آخر تحديد منسوخ لبنائه.\nيتيح لك __CONTROL__cycle-clipboard-forwards__ و__CONTROL__cycle-clipboard-backwards__ التنقل عبر سجل الحافظة.
fast-replace=بناء فوق كيان من نفس النوع والحجم سوف يقوم باستبدال سريع. سيحافظ الاستبدال السريع على خصائص الكيان الأصلي، مثل محتويات المخزون والوصفة المحددة.
fast-replace-direction=يمكنك استخدام الاستبدال السريع لتغيير اتجاه الكيانات بسرعة.
fast-replace-belt-splitter=يمكنك استبدال [entity=transport-belt] بسرعة بـ [entity=splitter] والعكس بالعكس.
fast-replace-belt-underground=يمكنك وضع [entity=underground-belt] مكان [entity=transport-belt] مباشرة بالاستبدال السريع، والعكس صحيح.\nستزال تلقائيًا أي أحزمة تقع بين مدخل الحزام تحت الأرض ومخرجه.\nتنطبق ميزة الاستبدال السريع هذه أيضًا على [entity=pipe] و[entity=pipe-to-ground].
rotating-assemblers=تتطلب بعض الوصفات مُدخل سوائل إلى [entity=assembling-machine-2]، مثل [recipe=electric-engine-unit]. يمكن تدوير جهاز التجميع ذي مُدخل السوائل باستخدام __CONTROL__rotate__.
circuit-network=الدارة الكهربائية نظام يتيح نقل المعلومات بين الآلات.\nيمكنك توصيل الآلات بدارة كهربائية باستخدام [shortcut=give-red-wire] و[shortcut=give-green-wire].\nيمكن للشبكة أن تحمل قيمًا صحيحة من -2³¹(-2,147,483,648) .. 2³¹(2,147,483,647) بشكل منفصل لكل نوع من الإشارات.\nلا يلزم استخدام الدارة الكهربائية لإنهاء اللعبة، لكنها تتيح الكثير من الآليات الممتعة أو التحسينات الدقيقة للمصنع التي لم تكن لتصبح ممكنة من دونها.
spidertron-control=يمكن ركوب [entity=spidertron] باستخدام __CONTROL__toggle-driving__، وقيادتها باستخدام __CONTROL_MOVE__.\nيمكن التحكم بها أيضًا عبر __CONTROL__give-spidertron-remote__. اضغط __CONTROL__use-item__ لإرسال المركبة العنكبوتية، و__CONTROL__alternative-use-item__ لإضافة أمر حركة إلى قائمة الانتظار.\nيمكن استخدام __CONTROL__select-for-cancel-deconstruct__ لإضافة مركبة عنكبوتية أخرى إلى التحديد، و__CONTROL__deselect__ لإلغاء تحديدها.
production-entity-list= مثقاب التعدين الكهربائي [entity=electric-mining-drill]\n مضخة [entity=pumpjack]\n آلة التجميع 2 [entity=assembling-machine-2]\n آلة التجميع 3 [entity=assembling-machine-3]\n فرن كهربائي [entity=electric-furnace]\n مصنع كيميائي [entity=chemical-plant]\nجهاز طرد مركزي [entity=centrifuge]
