stronger-explosives=يزيد من ضرر الأسلحة المتفجرة.
refined-flammables=يزيد من ضرر الأسلحة النارية.
weapon-shooting-speed=يزيد من سرعة إطلاق النار لمعظم أسلحة المقذوفات.
laser-shooting-speed=يزيد من سرعة إطلاق النار لأسلحة الليزر.
artillery-shell-range=يزيد نطاق الهدف لكل من الرماية الأوتوماتيكية واليدوية.
artillery-shell-speed=يزيد من سرعة اطلاق النار للمدفعية.
robotics=هياكل الروبوتات الطائرة. تحتاج إلى أن تكون مخصصة للقيام إما بالمهام اللوجستية أو البناء.
defender=أهم أنواع الروبوت القتالي. يتبع اللاعب ويساعده لفترة قصيرة.
distractor=نوع متوسط من الروبوت القتالي. يبقى في الموقع المنشور لإطلاق النار وتشتيت الأعداء.
destroyer=أكثر أنواع الروبوت القتالي تقدماً. يتبع اللاعب ويساعده لفترة زمنية محدودة.
follower-robot-count=يزيد من عدد الروبوتات المقاتلة التي تتبعك في نفس الوقت.
toolbelt=توسعة المخزن الخاص بك.
modules=يسمح لك بإجراء بحث للوحدات التي يمكن إدراجها في الآلات.
speed-module=هذه الوحدة تجعل الجهاز يعمل بشكل أسرع، لكنه يزيد أيضا من استهلاك الطاقة.
productivity-module=هذه الوحدة تسمح للجهاز بصناعة المزيد من المنتجات من نفس الكمية من المكونات، لكنه يزيد أيضا من استهلاك الطاقة ويقلل من السرعة.
efficiency-module=هذه الوحدة تقلل من استهلاك الطاقة للجهاز.
effect-transmission=ينشر تأثير الوحدات إلى الآلات الصديقة القريبة. تتراكم تأثيرات الانتقال مع عائدات متناقصة.
construction-robotics=يمكن لروبوتات البناء إصلاح وبناء كيانات صديقة. يمكنك أيضًا أن تطلب من الروبوتات بناء هياكل جديدة عن طريق وضع شبح هناك.
logistic-robotics=تستطيع الروبوتات اللوجستية توصيل الأشياء إلى الشخصية، أو أخذ الأشياء غير المرغوب بها بعيدا.
logistic-system=يفتح صناديق لوجستية إضافية تزيد من قدرات الروبوتات اللوجستية. الصناديق الطالبة تطلب الأشياء من الشبكة اللوجستية. الصناديق المزودة النشطة تبعث محتوياتها لتخزَّن أو تستعمل في مكان آخر. صناديق التخزين المؤقت تطلب أشياء محددة لتتاح للوجستية الشخصية والبناء الآلي.
worker-robots-speed=يزيد من سرعة طيران الآلات السوقية وآلات البناء.
worker-robots-storage=يزيد عدد المواد التي تستطيع ان تحملها الآلات السوقية وآلات البناء في الوقت ذاته.
rocket-fuel=وقود متطور متعدد الإستعمالات.
low-density-structure=مادة خفيفة لكنها قوية، مفيدة لسفن الفضاء والمعدات الشخصية.
