electric-energy-distribution=طرق أكثر مرونة لتوزيع الكهرباء.
electric-energy-accumulators=المباني التي تقوم بتخزين الطاقة الكهربائية الزائدة لوقت لاحق.
battery=خلية كهروكيميائية تخزن وتوفر الطاقة للأجهزة الكهربائية.
engine=تحول الوقود إلى حركة ميكانيكية. جزء أساسي لجميع المركبات.
electric-engine=تحويل الكهرباء إلى الحركة الميكانيكية.
research-speed=يفتح الباب لتطبيقات بحث أكثر كفاءة.
