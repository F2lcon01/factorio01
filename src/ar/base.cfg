[map-gen-preset-description]
default=الإعدادات العادية. الطريقة الموصي بها للعب Factorio.
rich-resources=بقع الموارد ثرية جدا، لذلك لا تحتاج الى التوسع كثيرًا.
marathon=والتكنولوجيات أكثر تكلفة.
death-world=العضاضون هم أكثر خطورة ويتطوروا بشكل أسرع.
death-world-marathon=التكنولوجيات أغلى, والعضاضون شديد الْخَطَر وكثيرون. فقط اختر هذا إذا أنت مخضرم في فاكتوريو.
rail-world=بقع الموارد كبيرة ومتباعدة جدًا لتشجيع أنظمة القطارات. الأعداء لن ينشؤوا أي قواعد جديدة أو ينتشروا في الأراضي التي تمت إبادتها.
ribbon-world=يقتصر ارتفاع الخريطة فقط على 128 وحدة، الذي يقدم مجموعه من التحديات والمواقف المثيرة للاهتمام.
lakes=بحيرات ذات حجم ثابت وأجراف تميل إلى اتباع الخط الساحلي. مسارات الغابات معطلة. الارتفاع نفسه كما في Factorio 1.1.
island=جزيرة كبيرة في محيط لا نهاية له. تم تعطيل مسارات الغابات.
[entity-description]
cargo-landing-pad=بعد إطلاق صاروخ، ستهبط هنا أي منتجات من العناصر المُطلقة.
cargo-pod=يسلم عناصر من إطلاق صواريخ علوم الفضاء إلى منصة هبوط البضائع.
underground-belt=تستخدم للسماح للحزام بعبور الكيانات أو التضاريس غير السالكة.
fast-underground-belt=تستخدم للسماح للحزام بعبور الكيانات أو التضاريس غير السالكة.
express-underground-belt=تستخدم للسماح للحزام بعبور الكيانات أو التضاريس غير السالكة.
centrifuge=يعالج عدة وصفات متعلقة باليورانيوم.
logistic-robot=نقل العناصر بين الصناديق اللوجستية.
construction-robot=بناء وإصلاح البنايات الصديقة تلقائيا.
active-provider-chest=يرسل محتواه إلى الشبكة اللوجستية.
passive-provider-chest=يجعل محتواه متاحا للشبكة اللوجستية.
storage-chest=تخزين طويل الأجل للشبكة اللوجستية.
buffer-chest=طلبات العناصر المحددة لتكون متاحة للخدمات اللوجستية الشخصية والبناء الآلي.
requester-chest=يطلب عناصر محددة من الشبكة اللوجستية.
splitter=يدمج أو يفصل حمولة أحزمة النقل 1:1.
fast-splitter=يدمج أو يفصل حمولة أحزمة النقل 1:1.
express-splitter=يدمج أو يفصل حمولة أحزمة النقل 1:1.
flamethrower-turret=يطلق سائلا مشتعلا على الأعداء.
artillery-turret=مدفع ذو مدى بعيد يستهدف قواعد الأعداء.
power-switch=تستخدم للتحكم في اتصالات الشبكة الكهربائية. كما يمكن التحكم به بواسطة شبكة الدائرة المنطقية.
radar=يفحص المناطق القريبة، و يظهر المساحات حولها.
beacon=ينشر تأثير الوحدات النمطية إلى الآلات الصديقة القريبة. تتراكم تأثيرات الانتقال مع عائدات متناقصة.
arithmetic-combinator=ينفذ العمليات الحسابية على إشارات شبكة الدوائر.
selector-combinator=تنفيذ عمليات اختيار على إشارات الشبكة الكهربائية.
decider-combinator=مقارنة إشارات شبكة الدائرة المنطقية.
constant-combinator=يخرج إشارات دائرة شبكة ثابتة.
boiler=يحرق الوقود ليحول الماء إلى بخار.
nuclear-reactor=يستخدم خلايا وقود اليورانيوم لتوليد الحرارة. الحرارة الناتجة تزداد عند وضع المفاعلات بالقرب من بعضها البعض.
heat-exchanger=يستعمل الحرارة لتحويل الماء إلى بخار.
steam-engine=يستهلك البخار لخلق الطاقة الكهربائية.
steam-turbine=يستهلك البخار لإنتاج الطاقة الكهربائية.
offshore-pump=تسحب المياه من البحيرات.
rocket-silo=يستخدم لصناعة وإطلاق الصاروخ للفوز باللعبة.
train-stop=محطة توقف القطارات الآلية.
rail-signal=يقسم السكة الحديدية إلى ممرات، مما يسمح لعدة قطارات بالتنقل على نفس الشبكة.
rail-chain-signal=قام بقراة الإشارة التالية في الطريق للسماح بتحكم أفضل القطارات.
locomotive=يشتغل وفق الجداول الزمنية المؤتمتة وسحب كامل جسد القطار.
item-request-proxy=هذا طلب لربوت البناء لنقل عنصر لهذا الكيان. __CONTROL__mine__ لحذف الطلب.
crash-site-chest-1=حاوية من السفينة المحطمة. قد تحتوي على أشياء مفيدة.
crash-site-chest-2=حاوية من السفينة المحطمة. قد تحتوي على أشياء مفيدة.
roboport=يتواصل مع الروبوتات الأخرى لإنشاء شبكات البناء واللوجستيات التي تستخدمها الروبوتات الإنشائية واللوجستية.
programmable-speaker=يتصل الدائرة المنطقية من أجل تشغيل الإنذارات والنغمات الموسيقية أو إظهار التحذيرات.
accumulator=يخزن الطاقة عندما يكون هناك فائض في الإنتاج، لتزويد الشبكة بالطاقة عند الحاجة.
solar-panel=خلال النهار ينتج 100٪ من قدرته الإنتاجية, تنخفض إنتاجيته إلى 0٪ في الليل.
entity-ghost=المخطط البنائي لكيان ما، المزيد في[tip=ghost-building]
item-on-ground=يمكن التقاطه بالضغط على __CONTROL__pick-items__.\nيمكن إسقاطه يدويًا [tip=z-dropping] أو بواسطة كيانات مثل [entity=burner-mining-drill].
parameter-x=يتم استخدام المعلمات لإعداد المخططات العامة في قائمة تكوين المخطط.
one-way-valve=يسمح بتدفق السوائل إذا كان مستوى سوائل الإدخال أعلى من مستوى سوائل الإخراج.
overflow-valve=يسمح بتدفق السائل إذا كان مستوى السائل الداخل أعلى من الحد الأقصى وأعلى من مستوى السائل الخارج.
top-up-valve=يسمح بتدفق السائل إذا كان مستوى السائل الخارجي أقل من الحد الأقصى، وكان مستوى السائل الداخلي أعلى من مستوى السائل الخارجي.
