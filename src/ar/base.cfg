[virtual-signal-description]
signal-everything=إذا استوفت جميع إشارات المُدخل الشرط، فسيتحقق الشرط.\nتكون النتيجة صحيحة عند عدم وجود أي مُدخلات.\nالمُخرج هو جميع إشارات المُدخل.
signal-anything=إذا استوفت أي من إشارات المُدخل الشرط، فسيتحقق الشرط.\nتكون النتيجة خاطئة عند عدم وجود أي مُدخلات.\nالمُخرج هو أول إشارة مُدخلة، أو أول إشارة اجتازت جميع الشروط، مع مراعاة ترتيب الإشارات في الحالتين.
signal-each=يتحقق من الشرط لكل إشارة مُدخلة على حدة.\nلكي تجتاز الإشارة بالكامل، يجب أن تجتاز جميع الشروط.\nالمُخرج هو كل إشارة اجتازت جميع الشروط.
signal-item-parameter=إشارة شاملة خاصة\nعند استخدامها في مقاطعة الجدول الزمني، تطابق أول عنصر يجتاز جميع شروط الانتظار وتستبدل الإشارة بذلك العنصر.\nكما تستبدل وسم النص المنسق في اسم المحطة المستهدفة.
signal-fuel-parameter=إشارة شاملة خاصة\nعند استخدامها في مقاطعة الجدول الزمني، تطابق أول وقود يجتاز جميع شروط الانتظار وتستبدل الإشارة بذلك الوقود.\nكما تستبدل وسم النص المنسق في اسم المحطة المستهدفة.
signal-fluid-parameter=إشارة شاملة خاصة\nعند استخدامها في مقاطعة الجدول الزمني، تطابق أول سائل يجتاز جميع شروط الانتظار وتستبدل الإشارة بذلك السائل.\nكما تستبدل وسم النص المنسق في اسم المحطة المستهدفة.
signal-signal-parameter=إشارة شاملة خاصة\nعند استخدامها في مقاطعة الجدول الزمني، تطابق أول إشارة تجتاز جميع شروط الانتظار وتستبدل الإشارة بتلك الإشارة.\nكما تستبدل وسم النص المنسق في اسم المحطة المستهدفة.
[item-description]
science=يمثل الناتج الإجمالي للبحوث.
science-pack=يستخدم من قبل مختبرات من أجل البحث.
space-science-pack=تستخدم في المخبر للبحث. يتم الحصول عليها باطلاق صاروخ مع قمر صناعي.
speed-module=يزيد من سرعة الجهاز بتكلفة زيادة استهلاك الطاقة.
productivity-module=تنتج الآلة منتجات إضافية مقابل زيادة استهلاك الطاقة وانخفاض السرعة.\nيمكن استخدامها على المنتجات المتوسطة فقط.
efficiency-module=يقلل من استهلاك طاقة الجهاز. الحد الأدنى من استهلاك الطاقة بنسبة 20٪.
rail=تُستخدم لبناء سكة حديدية مستقيمة يدويًا أو عبر مخطط السكك الحديدية.\n__CONTROL__build__ لبناء مسارات قصيرة مباشرة.\n__CONTROL__build-ghost__ لوضع مسارات شبحية طويلة.
copper-wire=تستخدم لربط وقطع الأعمدة الكهربائية ومفاتيح الطاقة يدويا بالضغط على __CONTROL__build__.
red-wire=يُستخدم لتوصيل الآلات بدارة كهربائية باستخدام __CONTROL__build__.
green-wire=تستخدم لتوصيل الآلات مع الدارة الكهربائية باستخدام __CONTROL__build__.
deconstruction-planner=تحدد عناصر للدمير من قبل روبورتات البناء.
upgrade-planner=تحدد العناصر للترقية من قبل روبورتات البناء.
blueprint=حفظ التصاميم للبناء الآلي.
blueprint-book=يخزن المخططات والأشياء المشابهة.
repair-pack=تستخدم لإصلاح الكيانات الصديقة.
