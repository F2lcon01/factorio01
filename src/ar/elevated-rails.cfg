[technology-description]
elevated-rail=• السكة الحديدية المرتفعة التي يمكن أن توضع فوق العقبات أو المياه للوصول إلى مناطق جديدة أو جعل شبكات السكة الحديدية أكثر كفاءه.
[tips-and-tricks-item-name]
elevated-rails=سكك حديدية مرتفعة
[tips-and-tricks-item-description]
elevated-rails=تُستخدم السكك الحديدية المرتفعة لعبور التضاريس التي لا يمكن اجتيازها أو العوائق الأخرى.\nللتبديل بين السكك الأرضية والمرتفعة، اضغط __CONTROL__toggle-rail-layer__ أثناء وضع بناء السكك.\n[entity=rail-ramp] يسمح للقطار بالانتقال إلى طبقة سكك مختلفة. ويُستخدم [entity=rail-support] لحمل طبقة السكك المرتفعة فوق الأرض أو الماء.
[mod-name]
elevated-rails=السكك الحديدية المرتفعة
[mod-description]
elevated-rails=تعديل يضيف سكك مرتفعة.
[item-description]
rail=تُستخدم لبناء سكك حديدية مستقيمة يدوياً أو عبر مخطط السكك.\n__CONTROL__build__ لبناء مسارات قصيرة مباشرة.\n__CONTROL__build-ghost__ لوضع مسارات شبحية طويلة.\n__CONTROL__toggle-rail-layer__ للتبديل بين المسارات الأرضية والمرتفعة.
